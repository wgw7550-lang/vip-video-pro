<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>造福人类，回馈于社会</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: #0a0a0a;
    color: #ccc;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-tap-highlight-color: transparent;
}

/* ── Title ────────────────────────────── */
.title {
    text-align: center;
    padding: 14px 16px 6px;
    font-size: 17px;
    font-weight: 700;
    color: #ddd;
    letter-spacing: 1px;
    flex-shrink: 0;
}
.title span { font-size: 11px; color: #555; font-weight: 400; margin-left: 8px; letter-spacing: 0; }

/* ── Top Bar ──────────────────────────── */
.top {
    display: flex;
    gap: 8px;
    padding: 12px 12px 8px;
    flex-shrink: 0;
    align-items: center;
}
.top input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #222;
    background: #111;
    color: #ddd;
    font-size: 14px;
    outline: none;
    min-width: 0;
}
.top input:focus { border-color: #555; }
.top input::placeholder { color: #444; }
.top button {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.15s;
}
.top button:active { background: #333; color: #fff; }
.top button.go { background: #2563eb; border-color: #3b82f6; color: #fff; }
.top button.go:active { background: #1d4ed8; }

/* ── Chips ────────────────────────────── */
.chips {
    display: flex;
    gap: 6px;
    padding: 4px 12px 8px;
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
    padding: 6px 12px;
    border-radius: 20px;
    background: #161616;
    border: 1px solid #222;
    font-size: 12px;
    color: #999;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 5px;
}
.chip:active { background: #222; }
.chip.on { background: #1a2a1a; border-color: #166534; color: #86efac; }
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: #333; flex-shrink: 0; }
.chip .dot.good { background: #22c55e; }

/* ── Status ───────────────────────────── */
.status {
    padding: 0 12px;
    font-size: 11px;
    color: #555;
    flex-shrink: 0;
    min-height: 18px;
    transition: color 0.3s;
}
.status.err { color: #f87171; }

/* ── Player ───────────────────────────── */
.player {
    flex: 1;
    margin: 6px 12px 12px;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    position: relative;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.player p { color: #222; font-size: 14px; }
.player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
}

/* ── Desktop ──────────────────────────── */
@media (min-width: 768px) {
    body { max-width: 700px; margin: 0 auto; }
}
</style>
</head>
<body>

<div class="title">造福人类<span>回馈于社会</span></div>
<div class="top">
    <input id="url" type="url" placeholder="粘贴视频链接…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="go" id="go">解析</button>
</div>

<div class="chips" id="chips"></div>
<div class="status" id="status">粘贴链接，点击解析</div>
<div class="player" id="player"><p>造福人类</p></div>

<script>
;(function () {
    'use strict';

    var PARSERS = [
        { name: '默认A',      url: 'https://json.fongmi.cc/web?url=' },
        { name: '默认B',      url: 'https://super.playr.top/?url=' },
        { name: 'CK解析',     url: 'https://www.ckplayer.vip/jiexi/?url=' },
        { name: 'Player-JY',  url: 'https://jx.playerjy.com/?url=' },
        { name: '虾米解析',   url: 'https://jx.xmflv.com/?url=' },
        { name: '789解析',    url: 'https://jiexi.789jiexi.icu:4433/?url=' },
        { name: 'HLS解析',    url: 'https://jx.hls.one/?url=' },
        { name: '极速解析',   url: 'https://jx.2s0.cn/player/?url=' },
        { name: '冰豆解析',   url: 'https://bd.jx.cn/?url=' },
        { name: '剖元解析',   url: 'https://www.pouyun.com/?url=' },
        { name: '973解析',    url: 'https://jx.973973.xyz/?url=' },
        { name: '七哥解析',   url: 'https://jx.nnxv.cn/tv.php?url=' },
        { name: 'playm3u8',   url: 'https://www.playm3u8.cn/jiexi.php?url=' },
        { name: '937解析',    url: 'https://bfq.937auth.vip?url=' },
        { name: '七七云解析', url: 'https://jx.77flv.cc/?url=' },
        { name: '芒果TV1',    url: 'https://video.isyour.love/player/getplayer?url=' },
        { name: 'M1907',      url: 'https://im1907.top/?jx=' },
        { name: 'Yparse',     url: 'https://jx.yparse.com/index.php?url=' },
    ];

    var urlEl = document.getElementById('url');
    var goEl = document.getElementById('go');
    var chipsEl = document.getElementById('chips');
    var statusEl = document.getElementById('status');
    var playerEl = document.getElementById('player');

    var activeUrl = '';
    var activeIdx = -1;
    var timer = null;
    var autoMode = false;

    // ── Health ────────────────────────────
    var Health = {
        KEY: 'vhp',
        load: function () { try { return JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) { return {}; } },
        save: function (s) { localStorage.setItem(this.KEY, JSON.stringify(s)); },
        getSorted: function () {
            var s = this.load();
            return PARSERS.map(function (p, i) { return { idx: i, name: p.name, url: p.url, score: (s[p.url] && s[p.url].score) || 100 }; })
                .sort(function (a, b) { return b.score - a.score; });
        },
        record: function (url, ok) {
            var s = this.load();
            var e = s[url] || { score: 100, ok: 0, no: 0 };
            if (ok) { e.ok += 1; e.score = Math.min(1000, e.score + 15); }
            else    { e.no += 1; e.score = Math.max(0, e.score - 25); }
            s[url] = e;
            this.save(s);
            renderChips();
        },
    };

    // ── Render ────────────────────────────
    function renderChips() {
        while (chipsEl.firstChild) chipsEl.removeChild(chipsEl.firstChild);

        // Auto toggle chip
        var autoChip = document.createElement('span');
        autoChip.className = 'chip' + (autoMode ? ' on' : '');
        autoChip.textContent = '自动';
        autoChip.addEventListener('click', function () {
            autoMode = !autoMode;
            localStorage.setItem('vhp_auto', autoMode ? '1' : '0');
            if (autoMode && activeUrl && activeIdx < 0) loadBest();
            renderChips();
        });
        chipsEl.appendChild(autoChip);

        // Parser chips
        var sorted = Health.getSorted();
        sorted.forEach(function (p) {
            var c = document.createElement('span');
            c.className = 'chip' + (p.idx === activeIdx ? ' on' : '');
            var dot = document.createElement('span');
            dot.className = 'dot' + (p.score >= 80 ? ' good' : '');
            c.appendChild(dot);
            c.appendChild(document.createTextNode(p.name));
            c.addEventListener('click', function () {
                if (!activeUrl) { setStatus('请先粘贴链接', true); return; }
                load(p);
            });
            chipsEl.appendChild(c);
        });
    }

    function setStatus(text, isErr) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (isErr ? ' err' : '');
    }

    function resetPlayer() {
        while (playerEl.firstChild) playerEl.removeChild(playerEl.firstChild);
        var p = document.createElement('p');
        p.textContent = '造福人类';
        playerEl.appendChild(p);
        activeIdx = -1;
        if (timer) { clearTimeout(timer); timer = null; }
    }

    // ── Player ────────────────────────────
    function load(parser) {
        if (timer) { clearTimeout(timer); timer = null; }
        while (playerEl.firstChild) playerEl.removeChild(playerEl.firstChild);

        var iframe = document.createElement('iframe');
        iframe.src = parser.url + activeUrl;
        iframe.allow = 'autoplay; encrypted-media; fullscreen';
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = 'no-referrer';

        timer = setTimeout(function () {
            Health.record(parser.url, false);
            setStatus(parser.name + ' 超时，换下一个', true);
            loadNext();
        }, 12000);

        iframe.addEventListener('load', function () {
            clearTimeout(timer); timer = null;
            Health.record(parser.url, true);
            setStatus(parser.name, false);
        });
        iframe.addEventListener('error', function () {
            clearTimeout(timer); timer = null;
            Health.record(parser.url, false);
            setStatus(parser.name + ' 失败', true);
        });

        playerEl.appendChild(iframe);
        activeIdx = parser.idx;
        renderChips();
    }

    function loadBest() {
        var sorted = Health.getSorted();
        load(sorted[0]);
    }

    function loadNext() {
        var sorted = Health.getSorted();
        var pos = -1;
        for (var i = 0; i < sorted.length; i++) { if (sorted[i].idx === activeIdx) { pos = i; break; } }
        if (pos + 1 < sorted.length) load(sorted[pos + 1]);
        else setStatus('所有解析器已尝试', true);
    }

    // ── Events ────────────────────────────
    goEl.addEventListener('click', function () {
        var u = urlEl.value.trim();
        if (!u) { setStatus('请输入链接', true); return; }
        if (!/^https?:\/\/.+/.test(u)) { setStatus('链接格式不对', true); return; }
        activeUrl = u;
        resetPlayer();
        renderChips();
        setStatus('选择解析器', false);
        if (autoMode) setTimeout(loadBest, 300);
    });

    urlEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); goEl.click(); }
    });

    // ── Init ──────────────────────────────
    if (localStorage.getItem('vhp_auto') === '1') autoMode = true;
    renderChips();
    urlEl.focus();

    var p = new URLSearchParams(window.location.search).get('url');
    if (p) { urlEl.value = p; goEl.click(); }
})();
</script>
</body>
</html>
